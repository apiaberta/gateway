name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check src/config.js src/db.js src/index.js src/plugins/authenticate.js src/routes/auth.js src/routes/proxy.js src/routes/admin.js src/routes/status.js

      - name: Check npm test script exists
        run: npm run test --if-present
